[workspace]
resolver = "3"
members = ["crates/odg-core", "crates/odg-cli", "src-tauri"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Keep `unwind` so `std::panic::catch_unwind` in `documents.rs` / `pdf.rs`
# catches panics from third-party PDF/Office parsers instead of aborting the app.
panic = "unwind"
strip = true
