name: CI

# Every push to main and every pull request: full three-OS desktop gate
# (Windows, Ubuntu, macOS), Windows WebView2 E2E smoke suite, and supply-chain
# vulnerability / crate policy audit.

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

# A newer push makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Desktop, CLI, and frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xvfb
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: desktop-${{ matrix.os }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify manifest version alignment
        run: node scripts/check-version.mjs
      - name: Verify documentation consistency
        run: node scripts/check-docs.mjs
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test
      # Type-checks and bundles. The desktop shell embeds `../dist` when it
      # compiles, so this must run before Cargo workspace checks.
      - name: Frontend build
        run: pnpm build
      - name: Rust formatting check
        run: cargo fmt --all -- --check
      - name: Rust static checks
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust workspace tests
        run: cargo test --workspace
      - name: Run WebView2 E2E suite
        if: matrix.os == 'windows-latest'
        run: node e2e/run.mjs
      - name: Upload WebView2 E2E diagnostics
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-windows
          path: e2e/artifacts/**
          if-no-files-found: warn

  security-audit:
    name: Supply chain and vulnerability audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit production npm dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Audit Rust crates (advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories bans sources
