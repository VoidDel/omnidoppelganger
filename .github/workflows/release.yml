name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version alignment, lint, and test gates
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: release-verify-linux
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify version alignment against git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Verify internal manifest version alignment
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: node scripts/check-version.mjs
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build
        run: pnpm build
      - name: Rust workspace tests (locked)
        run: cargo test --workspace --locked

  desktop:
    name: Build desktop bundles (${{ matrix.platform }})
    needs: [verify]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle_globs: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - platform: macos-latest
            bundle_globs: |
              target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            bundle_globs: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: release-${{ matrix.platform }}
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri bundles
        run: pnpm tauri build
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: ${{ matrix.bundle_globs }}
          if-no-files-found: error

  arch:
    name: Build Arch Linux package (x86_64)
    needs: [verify]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm \
            git nodejs pnpm rust pkgconf \
            cairo gdk-pixbuf2 glib2 gtk3 hicolor-icon-theme \
            libayatana-appindicator openssl webkit2gtk-4.1
      - uses: actions/checkout@v5
      - name: Build .pkg.tar.zst with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && bash packaging/arch/build-local.sh"
      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-linux-x86_64
          path: |
            target/arch/*.pkg.tar.*
            !target/arch/*-debug-*.pkg.tar.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, desktop, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Validate platform packages and generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          require_non_empty() {
            local label="$1"
            local pattern="$2"
            local found=()
            while IFS= read -r -d '' file; do
              found+=("$file")
            done < <(find artifacts -type f -name "$pattern" ! -name '*-debug-*.pkg.tar.*' -size +0c -print0)
            if [ "${#found[@]}" -eq 0 ]; then
              echo "ERROR: Missing or empty required ${label} artifact matching '${pattern}'" >&2
              exit 1
            fi
            echo "Verified ${label}: ${found[*]}"
          }

          require_non_empty "Windows NSIS installer (.exe)" "*.exe"
          require_non_empty "Windows MSI installer (.msi)" "*.msi"
          require_non_empty "macOS disk image (.dmg)" "*.dmg"
          require_non_empty "Ubuntu Debian package (.deb)" "*.deb"
          require_non_empty "Arch Linux package (.pkg.tar.zst)" "*.pkg.tar.zst"

          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [ -e "release-assets/$base" ]; then
              echo "ERROR: Duplicate release asset filename '$base'" >&2
              exit 1
            fi
            cp "$file" "release-assets/$base"
          done < <(find artifacts -type f ! -name '*-debug-*.pkg.tar.*' -size +0c -print0)

          (
            cd release-assets
            LC_ALL=C sha256sum -- * > SHA256SUMS.txt
            echo "Generated SHA256SUMS.txt:"
            cat SHA256SUMS.txt
          )
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -t ASSETS < <(find release-assets -maxdepth 1 -type f | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No staged release assets found under release-assets/" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --generate-notes --repo "${GITHUB_REPOSITORY}"
          fi
