[package]
name = "omnidoppelganger"
version.workspace = true
description = "OmniDoppelganger desktop app"
authors = []
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omnidoppelganger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
odg-core = { path = "../crates/odg-core" }
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
tokio-util = "0.7.20"
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy", "zip"] }
portable-pty = "0.9"
notify = "8"

[dev-dependencies]
tempfile = "3.27.0"


