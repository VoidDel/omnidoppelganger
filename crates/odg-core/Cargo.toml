[package]
name = "odg-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "http2", "native-tls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.3", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
