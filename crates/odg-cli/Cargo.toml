[package]
name = "odg-cli"
version = "0.7.11"
edition = "2024"
license = "MIT"
description = "Run one OmniDoppelganger task from the command line"

[[bin]]
name = "odg"
path = "src/main.rs"

[dependencies]
odg-core = { path = "../odg-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
