[package]
name = "odg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run one OmniDoppelganger task from the command line"

[[bin]]
name = "odg"
path = "src/main.rs"

[dependencies]
odg-core = { path = "../odg-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
